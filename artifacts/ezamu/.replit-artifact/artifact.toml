kind = "web"
previewPath = "/"
title = "Ezamu"
version = "1.0.0"
id = "artifacts/ezamu"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25964

[services.development]
run = "pnpm --filter @workspace/ezamu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ezamu", "run", "build" ]
publicDir = "artifacts/ezamu/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25964"
BASE_PATH = "/"
